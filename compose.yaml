services:
  collector:
    build: .
    platform: linux/arm64
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./web/data:/app/web/data
    command: ["python", "-m", "proleague.pipeline", "--local", "--mode", "smoke"]
    profiles: ["collect"]
  preview:
    build: .
    platform: linux/arm64
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./data:/app/data
      - ./web/data:/app/web/data
    command: ["python", "scripts/dev_server.py", "--host", "0.0.0.0", "--port", "8000"]
